services:
  scanner:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SHODAN_API_KEY=${SHODAN_API_KEY}
      - RAW_EVIDENCE_ENABLED=${RAW_EVIDENCE_ENABLED:-false}
      - RAW_EVIDENCE_SAMPLE_LIMIT=${RAW_EVIDENCE_SAMPLE_LIMIT:-1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_TO_FILE=${LOG_TO_FILE:-true}
      - LOG_DIR=/app/results/logs
      - LOG_MAX_BYTES=${LOG_MAX_BYTES:-5242880}
      - LOG_BACKUP_COUNT=${LOG_BACKUP_COUNT:-5}
    volumes:
      - ./results:/app/results
    networks:
      - scanner-net

  # Optional: nginx reverse proxy with TLS termination
  # Uncomment if you're not using an existing nginx/caddy on the host
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - scanner
  #   networks:
  #     - scanner-net

networks:
  scanner-net:
    driver: bridge
