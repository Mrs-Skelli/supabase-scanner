[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supabase-research-scanner"
version = "0.1.0"
description = "Bounded Supabase access checks for authorized research"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
]

[project.scripts]
supascan = "cli:main"

[tool.setuptools]
py-modules = ["cli", "scanner", "scan_models", "fingerprints", "ssrf_guard", "supabase_probe", "masking", "observability"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
